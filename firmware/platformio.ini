; Firmware de la cerradura — ESP32 + PN532 (I2C) + relé/solenoide
; Compilar:  pio run          Subir:  pio run -t upload        Monitor:  pio device monitor
[env:esp32dev]
; Versiones FIJAS: la plataforma 7.0.1 trae Arduino-ESP32 2.0.17 (ESP-IDF 4.4.7).
; MQTT (esp-mqtt), HTTPS (esp_http_client), LittleFS, NVS (Preferences) y mbedTLS vienen incluidos en el framework.
platform = espressif32@7.0.1
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
board = esp32dev
upload_speed = 921600
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3   ; 3 = info: muestra el log de arranque, accesos y conexiones
  -DARDUINOJSON_ENABLE_STD_STRING=1
build_unflags = -std=gnu++11
lib_deps =
  adafruit/Adafruit PN532@1.3.4
  adafruit/Adafruit BusIO@1.17.4
  bblanchon/ArduinoJson@7.2.1
